<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人学习笔记：中英文 Markdown 与 PDF 资料目录。">
  <title>学习笔记 · Xuxu0927</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2328;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1220px;margin:auto;padding:38px 28px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d1d9e0;padding-bottom:20px}a{color:#0969da;text-underline-offset:4px}nav{display:flex;gap:18px;align-items:center}button{font:inherit;color:#0969da;border:1px solid #d1d9e0;border-radius:6px;background:#fff;padding:5px 14px;cursor:pointer}button:hover{background:#f6f8fa}button:focus-visible,a:focus-visible{outline:3px solid #54aeff;outline-offset:4px}.brand{font-weight:600;letter-spacing:.06em;color:#59636e;font-size:14px}h1{font-size:32px;margin:38px 0 8px;line-height:1.3}p{color:#59636e;margin:0 0 26px}.table-wrap{overflow-x:auto;border:1px solid #d1d9e0;border-radius:6px}table{width:100%;border-collapse:collapse;min-width:760px;text-align:left}caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}th,td{padding:13px 18px;border-right:1px solid #d1d9e0;border-bottom:1px solid #d1d9e0}th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}thead{background:#f6f8fa}th{font-weight:600;white-space:nowrap}tbody tr:nth-child(even){background:#f6f8fa}.empty td{text-align:center;padding:58px 18px;color:#59636e}footer{margin-top:28px;color:#59636e;font-size:14px}.missing{color:#8c959f}noscript{display:block;padding:18px;background:#fff8c5}@media(max-width:600px){main{padding:22px 16px 45px}h1{font-size:27px}nav{gap:12px}.brand{font-size:12px}th,td{padding:12px}}
  </style>
</head>
<body>
<main>
  <header><span class="brand">XUXU0927 / NOTES</span><nav aria-label="导航"><a id="admin-link" href="admin/">管理</a><a href="https://github.com/Xuxu0927/docs">GitHub</a><button type="button" id="language" aria-label="Switch to English">English</button></nav></header>
  <h1 id="heading">学习笔记</h1>
  <p id="intro">中英文笔记与资料，点击 MD / PDF 下载。</p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="笔记目录">
    <table><caption id="caption">笔记资料目录</caption><thead><tr id="columns"><th scope="col">序号</th><th scope="col">主题</th><th scope="col">中文 Markdown</th><th scope="col">英文 Markdown</th><th scope="col">中文 PDF</th><th scope="col">英文 PDF</th></tr></thead><tbody id="notes"><tr class="empty"><td colspan="6">暂无笔记，后续持续更新。</td></tr></tbody></table>
  </div>
  <footer id="footer">共 0 篇笔记 · 持续积累，慢慢生长。</footer>
  <noscript>如需切换语言或查看完整目录，请启用 JavaScript，或访问 <a href="https://github.com/Xuxu0927/docs">GitHub 仓库</a>。</noscript>
</main>
<script id="catalog" type="application/json">__CATALOG__</script>
<script>
const notes = JSON.parse(document.getElementById('catalog').textContent);
let language = 'zh';
const copy = {
 zh:{title:'学习笔记',intro:'中英文笔记与资料，点击 MD / PDF 下载。',columns:['序号','主题','中文 Markdown','英文 Markdown','中文 PDF','英文 PDF'],empty:'暂无笔记，后续持续更新。',missing:'待补充',caption:'笔记资料目录',footer:n=>`共 ${n} 篇笔记 · 持续积累，慢慢生长。`},
 en:{title:'Study Notes',intro:'Notes in Chinese and English. Click MD / PDF to download.',columns:['No.','Topic','Chinese Markdown','English Markdown','Chinese PDF','English PDF'],empty:'No notes yet. More to come.',missing:'Coming soon',caption:'Notes directory',footer:n=>`${n} notes · Learning, one page at a time.`}
};
function render(){
 const t=copy[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=t.title+' · Xuxu0927';
 document.getElementById('admin-link').textContent=language==='zh'?'管理':'Manage';
 for(const [id,value] of Object.entries({heading:t.title,intro:t.intro,caption:t.caption,footer:t.footer(notes.length)}))document.getElementById(id).textContent=value;
 document.querySelector('nav').setAttribute('aria-label',language==='zh'?'导航':'Navigation');document.querySelector('.table-wrap').setAttribute('aria-label',t.caption);
 const button=document.getElementById('language');button.textContent=language==='zh'?'English':'简体中文';button.setAttribute('aria-label',language==='zh'?'Switch to English':'切换为简体中文');
 const columns=document.getElementById('columns');columns.replaceChildren();t.columns.forEach(label=>{const th=document.createElement('th');th.scope='col';th.textContent=label;columns.append(th)});
 const body=document.getElementById('notes');body.replaceChildren();
 notes.forEach((note,i)=>{const row=document.createElement('tr');[String(i+1),note.title[language]].forEach(value=>{const td=document.createElement('td');td.textContent=value;row.append(td)});
 for(const key of ['md_zh','md_en','pdf_zh','pdf_en']){const td=document.createElement('td');if(note[key]){const a=document.createElement('a');a.textContent=key.startsWith('md')?'MD':'PDF';a.href=note[key].split('/').map(encodeURIComponent).join('/');a.download=note[key].split('/').pop();a.title=(language==='zh'?'下载 ':'Download ')+a.download;td.append(a)}else{td.textContent=t.missing;td.className='missing'}row.append(td)}body.append(row)});
 if(!notes.length){const row=document.createElement('tr');row.className='empty';const td=document.createElement('td');td.colSpan=6;td.textContent=t.empty;row.append(td);body.append(row)}
}
document.getElementById('language').addEventListener('click',()=>{language=language==='zh'?'en':'zh';render()});render();
</script>
</body>
</html>
