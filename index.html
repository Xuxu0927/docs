<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学习笔记</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:48px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:24px;font-weight:600;margin:0}nav{display:flex;align-items:center;gap:20px}a,button{color:#0969da}a{text-underline-offset:3px}button{font:inherit;background:none;border:0;padding:0;cursor:pointer}button:focus-visible,a:focus-visible,.table-wrap:focus-visible{outline:2px solid #0969da;outline-offset:4px}.table-wrap{overflow-x:auto}table{width:100%;min-width:730px;border-collapse:collapse;text-align:left;background:#fff}caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}th,td{border:1px solid #ddd;padding:12px 16px;background:#fff}th{font-weight:600;white-space:nowrap}.missing{color:#999}#error{font-size:13px;color:#666;margin:12px 0 0}@media(max-width:600px){main{margin:24px auto;padding:0 16px}h1{font-size:21px}nav{gap:14px}th,td{padding:10px 12px}}
    .category{margin-top:30px}.category:first-child{margin-top:0}h2{font-size:18px;font-weight:600;margin:0 0 12px}table{table-layout:fixed;min-width:900px}th:first-child{width:7%}th:nth-child(2){width:23%}th:nth-child(3),th:nth-child(4){width:20%}th:nth-child(5),th:nth-child(6){width:15%}
  </style>
  <script type="module" src="notes.js"></script>
</head>
<body>
  <main>
    <header><h1 id="heading">学习笔记</h1><nav aria-label="导航"><a href="https://github.com/Xuxu0927/docs">GitHub</a><button type="button" id="language" aria-label="Switch to English">English</button></nav></header>
    <div id="categories"></div>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
